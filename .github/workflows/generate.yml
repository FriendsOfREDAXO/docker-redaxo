name: Generate

on:
  pull_request:
    paths:
      - "source/**/*"

concurrency:
  # Cancel in-progress jobs if a new job is trigged by a commit from the same branch
  # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The auto-commit is pushed with a GitHub App token (see below), so the built-in token only needs read access
permissions:
  contents: read

jobs:
  generate:
    name: Generate image files from source
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        # Commits pushed with the built-in GITHUB_TOKEN do not trigger new workflow runs (so the tests would not run
        # for the generated files). Commits pushed with a GitHub App token do.
        # https://github.com/actions/create-github-app-token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FRIENDSOFREDAXO_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FRIENDSOFREDAXO_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
        with:
          # Ref is required if auto-commit action is used in pull requests.
          # https://github.com/stefanzweifel/git-auto-commit-action#checkout-the-correct-branch
          ref: ${{ github.head_ref }}
          # The auto-commit action pushes with the credentials of the checkout
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Deno
        # https://github.com/denoland/setup-deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "^2"

      - name: Run generator script
        run: deno task start

      - name: Auto-commit changed files
        # Automatically commit files which have been changed during the workflow run and push changes back
        # to remote repository.
        # https://github.com/stefanzweifel/git-auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Generate image files from source"
          commit_user_name: "friendsofredaxo-bot[bot]"
          commit_user_email: "361493093+friendsofredaxo-bot[bot]@users.noreply.github.com"
          commit_author: "friendsofredaxo-bot[bot] <361493093+friendsofredaxo-bot[bot]@users.noreply.github.com>"
          file_pattern: "images/**/*"
